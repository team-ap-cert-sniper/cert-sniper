# 공통 설정. 비밀값은 레포 루트의 .env(커밋 금지)에서 읽는다.
spring:
  application:
    name: cert-sniper
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/cert_sniper?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:cert_app}
    password: ${DB_APP_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  # 인증 메일
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


  jackson:
    time-zone: Asia/Seoul
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

# 서비스 설정
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    allowed-origins: http://localhost:5173
  idiom:
    base-date: 2026-01-01
  ai:
    base-url: ${AI_BASE_URL:http://localhost:11434}
    model: ${AI_MODEL:qwen2.5}
    timeout-seconds: 60
  schema-version: "3"

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.certsniper: DEBUG

---
# 로컬 개발: 실행 SQL을 로그에 표시
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
