name: cert-sniper

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      MYSQL_DATABASE: jg_service
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  flyway:
    image: flyway/flyway:11
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://db:3306/jg_service?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: cert_migrator
      FLYWAY_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    command: migrate

  service-data-sql:
    image: python:3.12-alpine
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./etl:/etl:ro
      - service-data:/out
    command: ["python", "/etl/tools/load_service_data.py", "--output", "/out/service-data.sql"]

  service-data:
    image: mysql:8.0
    depends_on:
      flyway:
        condition: service_completed_successfully
      service-data-sql:
        condition: service_completed_successfully
    environment:
      MYSQL_PWD: ${DB_MIGRATOR_PASSWORD}
    volumes:
      - service-data:/out:ro
      - ./db/seed:/seed:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$(mysql -h db -u cert_migrator -N -e 'SELECT COUNT(*) FROM jg_service.qualifications')" = "0" ]; then
          mysql -h db -u cert_migrator --default-character-set=utf8mb4 < /out/service-data.sql
        fi
        if [ "$$(mysql -h db -u cert_migrator -N -e "SELECT COUNT(*) FROM jg_service.users WHERE role = 'ADMIN'")" = "0" ]; then
          mysql -h db -u cert_migrator --default-character-set=utf8mb4 < /seed/admin_accounts.sql
        fi

volumes:
  db-data:
  service-data:
